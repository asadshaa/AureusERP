<!DOCTYPE html>
<html>
<head><title>Geo Test</title></head>
<body>
<h1>Testing Geolocation</h1>
<pre id="out">Starting test...</pre>
<script>
function log(msg) {
    document.getElementById('out').innerText += '\n' + msg;
    console.log(msg);
}

log('1. Calling getCurrentPosition with enableHighAccuracy: false, timeout: 15000, maximumAge: 60000');
navigator.geolocation.getCurrentPosition(
    (pos) => {
        log('SUCCESS: Lat=' + pos.coords.latitude + ' Lng=' + pos.coords.longitude + ' Acc=' + pos.coords.accuracy);
    },
    (err) => {
        log('ERROR: code=' + err.code + ' (' + ['NONE', 'PERMISSION_DENIED', 'POSITION_UNAVAILABLE', 'TIMEOUT'][err.code] + ') msg=' + err.message);
    },
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
);
</script>
</body>
</html>
